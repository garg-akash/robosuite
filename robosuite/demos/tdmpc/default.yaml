# environment
env_name: 'Lift'
robot_name: 'UR5e'
controller_name: 'OSC_POSE'
use_camera_obs: False
modality: 'State'
discount: 0.99
action_repeat : 1
train_steps: 300000/${action_repeat}
episode_length: 150/${action_repeat}

device : 'cuda'

mode : 'training'
test_episodes: 10

# planning
iterations: 6
num_samples : 256
num_elites: 64
mixture_coef: 0.05
min_std: 0.05
temperature: 0.5
momentum: 0.1

# learning
batch_size : 512
max_buffer_size: 500000
horizon : 5
reward_coef: 0.5
value_coef: 0.1
consistency_coef: 2
rho: 0.5
kappa: 0.1
lr: 3e-4
std_schedule: linear(0.5, ${min_std}, 15000)
horizon_schedule: linear(1, ${horizon}, 15000)
per_alpha: 0.6
per_beta: 0.4
grad_clip_norm: 10
seed_steps: 1500
update_freq: 2
tau: 0.01

# architecture
latent_dim : 50
mlp_dim : 512
enc_dim : 256

# wandb (insert your own)
use_wandb: True
wandb_project: "tdmpc-lift-ur5e"
wandb_entity: "ak-self"

# misc
seed: 1
exp_name: default
eval_freq: 6000
eval_episodes: 5
save_video: false
save_model: true
# save_mode_freq: 1500